<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{

}

body{
    min-height:100vh;

    color:#eee4d4;
    background:#141116;

}

}

.page{

}

.page.active{

/* =================================================
   提取码
================================================= */

.lock-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
    position:relative;
    overflow:hidden;
    background:
    radial-gradient(circle at 50% 20%,rgba(173,127,80,.2),transparent 30%),
    linear-gradient(145deg,#100e13,#241b21,#110e13);
}

.lock-page:before,
.lock-page:after{
    content:"";
    position:absolute;
    border:1px solid rgba(206,169,113,.18);
    border-radius:50%;
}

.lock-page:before{
    width:430px;
    height:430px;
    top:-180px;
    right:-180px;
}

.lock-page:after{
    width:350px;
    height:350px;
    bottom:-170px;
    left:-170px;
}

.lock-box{
    width:100%;
    max-width:430px;
    padding:45px 28px;
    text-align:center;
    background:rgba(20,16,22,.86);
    border:1px solid rgba(213,173,116,.25);
    box-shadow:0 30px 100px rgba(0,0,0,.5);
    position:relative;
    z-index:2;
}

.small-title{
    color:#b99a70;
    font-size:11px;
    letter-spacing:6px;
    margin-bottom:20px;
}

.lock-box h1{
    font-size:31px;
    font-weight:400;
    letter-spacing:5px;
}

.lock-sub{
    margin:18px 0 30px;
    color:#a99c92;
    font-size:13px;
    line-height:2;
}

.code-input{
    width:100%;
    height:53px;
    border:1px solid rgba(204,168,115,.4);

    color:#f5e8d5;

    font-size:20px;
    letter-spacing:10px;
}

.code-input:focus{
    border-color:#c7a171;
}

.enter-btn{
    width:100%;
    height:53px;
    border:0;
    margin-top:15px;
    background:linear-gradient(90deg,#98734e,#c5a273);
    color:#171218;
    letter-spacing:5px;
    cursor:pointer;
}

.error{
    height:20px;
    margin-top:10px;
    color:#c98c84;
    font-size:12px;
}

/* =================================================
   首页
================================================= */

.home{
    max-width:720px;
    margin:auto;
    padding:50px 20px 60px;
    text-align:center;
}

.ornament{
    color:#b8976c;
    letter-spacing:12px;
    margin-bottom:28px;
}

.home h1{

}

.english{

    font-size:10px;

}

.home-desc{

    margin:30px auto;
    color:#b7aaa0;
    font-size:14px;
    line-height:2.1;
}

.stone{
    width:210px;
    height:210px;
    margin:38px auto;
    border:1px solid rgba(207,170,116,.35);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.stone:before{
    content:"";
    position:absolute;
    width:168px;
    height:168px;
    border:1px solid rgba(207,170,116,.2);
    border-radius:50%;
}

.stone:after{
    content:"";
    position:absolute;
    width:125px;
    height:125px;
    border:1px solid rgba(207,170,116,.15);
    border-radius:50%;
}

.stone-text{
    position:relative;
    z-index:2;
    writing-mode:vertical-rl;
    font-size:21px;
    letter-spacing:8px;
    color:#d2b07d;
}

.start-btn{
    width:245px;
    height:55px;
    border:1px solid #b9986b;
    background:rgba(185,152,105,.06);
    color:#d7bb91;
    cursor:pointer;
    letter-spacing:5px;
    transition:.3s;
}

.start-btn:hover{
    background:#b9986b;
    color:#171218;
}

.notice{
    margin-top:25px;
    color:#6f6863;
    font-size:10px;
}

/* =================================================
   测试
================================================= */

.quiz-wrap{
    max-width:700px;
    margin:auto;
    padding:25px 20px 50px;
}

.quiz-top{
    display:flex;
    justify-content:space-between;
    color:#91847b;
    font-size:11px;
    letter-spacing:2px;
}

.progress{
    height:2px;
    background:#342d31;
    margin:15px 0 40px;
}

.progress-bar{
    height:100%;
    width:0;
    background:#c29e70;
    transition:.4s;
}

.question{
    min-height:430px;
}

.question-type{
    color:#ad8b63;
    font-size:11px;
    letter-spacing:3px;
    margin-bottom:18px;
}

.question h2{
    font-weight:400;
    font-size:24px;
    line-height:1.7;
    margin-bottom:30px;
}

.option{
    width:100%;
    text-align:left;
    border:1px solid rgba(201,164,115,.18);
    background:rgba(255,255,255,.025);
    color:#d7cec6;
    padding:17px;
    margin-bottom:12px;
    cursor:pointer;
    line-height:1.7;
    transition:.25s;
}

.option:hover{
    border-color:#b6966c;
    background:rgba(183,146,101,.08);
}

.option.selected{
    border-color:#c8a473;
    background:rgba(188,149,103,.15);
    color:#f1ddc0;
}

.next-btn{
    width:100%;
    height:50px;
    border:0;
    background:#b89568;
    color:#171218;
    letter-spacing:4px;
    cursor:pointer;
}

.next-btn:disabled{
    opacity:.3;
}

/* =================================================
   结果通用
================================================= */

.result-page{
    min-height:100vh;
    position:relative;
    overflow:hidden;
    transition:background .5s;
}

.result-bg{
    position:absolute;
    inset:0;
    z-index:0;
    background:
    radial-gradient(circle at 50% 15%,var(--glow),transparent 30%),
    linear-gradient(145deg,var(--bg1),var(--bg2) 55%,var(--bg3));
}

.result-bg:before{
    content:"";
    position:absolute;
    inset:0;
    opacity:.12;
    background-image:
    radial-gradient(circle at 20% 30%,white 1px,transparent 1px),
    radial-gradient(circle at 80% 70%,white 1px,transparent 1px);
    background-size:90px 90px,130px 130px;
}

.result-decoration{
    position:absolute;
    width:420px;
    height:420px;
    border:1px solid var(--line);
    border-radius:50%;
    top:-230px;
    right:-180px;
}

.result-decoration:before{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    border:1px solid var(--line);
    border-radius:50%;
    left:55px;
    top:55px;
}

.result-content{
    max-width:700px;
    margin:auto;
    padding:35px 20px 60px;
    position:relative;
    z-index:2;
}

.result-card{
    background:rgba(18,15,20,.73);
    border:1px solid var(--line);
    box-shadow:0 30px 100px rgba(0,0,0,.38);
    backdrop-filter:blur(12px);
    padding:34px 23px;
}

.result-label{
    text-align:center;
    font-size:10px;
    letter-spacing:6px;
    color:var(--accent);
    margin-bottom:20px;
}

.result-card h1{
    text-align:center;
    font-size:38px;
    font-weight:400;
    letter-spacing:5px;
}

.actor{
    text-align:center;
    margin-top:10px;
    color:#aaa099;
    font-size:12px;
}

.result-type{
    text-align:center;
    margin-top:12px;
    color:var(--accent);
    font-size:12px;
    letter-spacing:3px;
}

.divider{
    width:65px;
    height:1px;
    background:var(--accent);
    margin:24px auto;
}

.tags{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:7px;
}

.tag{
    border:1px solid var(--line);
    color:#c5b4a6;
    padding:5px 10px;
    font-size:10px;
}

.match{
    margin:28px 0;
    text-align:center;
}

.match-title{
    font-size:10px;
    letter-spacing:3px;
    color:#8f827a;
}

.match-number{
    font-family:Georgia,serif;
    color:var(--accent);
    font-size:43px;
    margin:5px 0;
}

.match-track{
    height:3px;
    background:#332d31;
}

.match-fill{
    height:100%;
    background:var(--accent);
}

.story{
    color:#c7bdb5;
    font-size:14px;
    line-height:2.15;
}

.story-title{
    color:var(--accent);
    font-size:15px;
    margin:24px 0 10px;
}

.story p{
    margin-bottom:15px;
}

.quote{
    margin:25px 0;
    padding:22px;
    border-left:2px solid var(--accent);
    background:rgba(255,255,255,.025);
    color:#ddc8b4;
    font-size:15px;
    line-height:2;
}

.relations{
    margin-top:35px;
}

.relations h3{
    font-size:13px;
    font-weight:400;
    color:var(--accent);
    letter-spacing:2px;
    margin-bottom:12px;
}

.relation{
    display:flex;
    justify-content:space-between;
    padding:13px 0;
    border-bottom:1px solid rgba(255,255,255,.07);
    color:#9f958e;
    font-size:12px;
}

.relation strong{
    color:#d8cbc0;
    font-weight:400;
}

.type-analysis{
    margin-top:28px;
    padding:20px;
    border:1px solid var(--line);
}

.type-analysis h3{
    color:var(--accent);
    font-size:13px;
    font-weight:400;
    margin-bottom:10px;
}

.type-analysis p{
    color:#a99f98;
    font-size:12px;
    line-height:2;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:30px;
}

.action-btn{
    flex:1;
    height:48px;
    border:1px solid var(--accent);
    background:transparent;
    color:var(--accent);
    cursor:pointer;
}

.action-btn.primary{
    background:var(--accent);
    color:#171218;
}

.bottom-note{
    text-align:center;
    color:#6f6863;
    font-size:10px;
    margin-top:25px;
}

@media(max-width:500px){

    .home h1{
        font-size:30px;
    }

    .question h2{
        font-size:21px;
    }

    .result-card h1{
        font-size:30px;
    }

    .stone{
        width:180px;
        height:180px;
    }

    .actions{
        flex-direction:column;
    }
}
</style>
</head>

/* =====================================================

===================================================== */

let scores={};

people.forEach(p=>{
    scores[p.name]=0;
});


/* =====================================================
   提取码
===================================================== */

function checkCode(){

    const code=
        document.getElementById("codeInput").value.trim();

    if(code===ACCESS_CODE){

        document
        .getElementById("lockPage")
        .classList.remove("active");

        document
        .getElementById("homePage")
        .classList.add("active");

    }else{

        document
        .getElementById("error")
        .innerText="提取码不正确";

        document
        .getElementById("codeInput")
        .value="";

    }
}


/* =====================================================
   开始测试
===================================================== */

function startQuiz(){

    currentQuestion=0;

    answers=[];

    scores={};

    people.forEach(p=>{
        scores[p.name]=0;
    });

    document
    .getElementById("homePage")
    .classList.remove("active");

    document
    .getElementById("quizPage")
    .classList.add("active");

    showQuestion();

    window.scrollTo(0,0);
}


/* =====================================================
   显示题目
===================================================== */

function showQuestion(){

    selectedAnswer=null;

    const q=questions[currentQuestion];

    document
    .getElementById("questionNumber")
    .innerText=
    String(currentQuestion+1).padStart(2,"0")
    +" / "
    +questions.length;

    document
    .getElementById("progressBar")
    .style.width=
    ((currentQuestion)/questions.length*100)+"%";

    let html=`

    <div class="question-type">
    DESTINY QUESTION ·
    ${String(currentQuestion+1).padStart(2,"0")}
    </div>

    <h2>${q.q}</h2>

    `;

    q.a.forEach((a,index)=>{

        html+=`

        <button
        class="option"
        onclick="
        selectOption(this,'${a[2]}',${index})
        ">

        ${a[0]}．${a[1]}

        </button>

        `;

    });

    document
    .getElementById("questionBox")
    .innerHTML=html;

    document
    .getElementById("nextBtn")
    .disabled=true;

    document
    .getElementById("nextBtn")
    .innerText=
    currentQuestion===questions.length-1
    ?"揭晓前世郎君"
    :"下一题";
}


/* =====================================================
   选择
===================================================== */

function selectOption(el,type,index){

    document
    .querySelectorAll(".option")
    .forEach(btn=>{
        btn.classList.remove("selected");
    });

    el.classList.add("selected");

    selectedAnswer={
        type:type,
        index:index
    };

    document
    .getElementById("nextBtn")
    .disabled=false;
}


/* =====================================================
   下一题
===================================================== */

function nextQuestion(){

    if(!selectedAnswer) return;

    answers.push(selectedAnswer);

    const candidates=people.filter(
        p=>p.type===selectedAnswer.type
    );

    /*
      类型基础分
    */

    candidates.forEach(p=>{
        scores[p.name]+=1;
    });

    /*
      根据选项位置制造人物差异
    */

    const chosen=
        candidates[
            (currentQuestion+selectedAnswer.index)
            %candidates.length
        ];

    if(chosen){
        scores[chosen.name]+=0.65;
    }

    if(currentQuestion===questions.length-1){

        showResult();

        return;
    }

    currentQuestion++;

    showQuestion();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

        margin-bottom:6px;
        ">

            <span>${name}</span>

            <span>${percent}%</span>

        </div>

        <div style="
        height:3px;
        background:#332d31;
        ">

            <div style="
            width:${percent}%;
            height:100%;
            background:var(--accent);
            "></div>

        </div>

    </div>

    `;
}


/* =====================================================
   核心：人物专属主题
===================================================== */

function applyTheme(person){

    const page=
        document.getElementById("resultPage");

    const bg=
        document.getElementById("resultBg");

    bg.style.setProperty(
        "--bg1",
        person.bg[0]
    );

    bg.style.setProperty(
        "--bg2",
        person.bg[1]
    );

    bg.style.setProperty(
        "--bg3",
        person.bg[2]
    );

    bg.style.setProperty(
        "--accent",
        person.accent
    );

    bg.style.setProperty(
        "--line",
        person.line
    );

    bg.style.setProperty(
        "--glow",
        person.accent
    );
}


/* =====================================================
   重新测试
===================================================== */

function restart(){

    document
    .getElementById("resultPage")
    .classList.remove("active");

    document
    .getElementById("quizPage")
    .classList.add("active");

    startQuiz();
}


/* =====================================================
   返回首页
===================================================== */

function backHome(){

    document
    .getElementById("resultPage")
    .classList.remove("active");

    document
    .getElementById("homePage")
    .classList.add("active");

    window.scrollTo(0,0);
}


/* =====================================================
   回车输入提取码
===================================================== */

document
.getElementById("codeInput")
.addEventListener(
"keydown",
function(e){

    if(e.key==="Enter"){
        checkCode();
    }

});

</script>
